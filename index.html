<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css">
    <title>KB Editor</title>
  </head>
  <body>
    <main>
        <div class="toolbar">
            <select class="toolbar_dropdown">
                <option value="andalemono">Andale Mono</option>
                <option value="arial">Arial</option>
                <option value="arialblack">Arial Black</option>
                <option value="bookantiqua">Book Antiqua</option>
                <option value="comicsansms">Comic Sans MS</option>
                <option value="couriernew">Courier New</option>
                <option value="georgia">Georgia</option>
                <option value="helvetica" selected>Helvetica</option>
                <option value="impact">Impact</option>
                <option value="symbol">Symbol</option>
                <option value="tahoma">Tahoma</option>
                <option value="terminal">Terminal</option>
                <option value="timesnewroman">Times New Roman</option>
                <option value="trebuchetms">Trebuchet MS</option>
                <option value="verdana">Verdana</option>
                <option value="webdings">Webdings</option>
                <option value="wingdings">Wingdings</option>
            </select>

            <select class="toolbar_dropdown">
                <option value="7">7pt</option>
                <option value="7.5">7.5pt</option>
                <option value="8">8pt</option>
                <option value="10" selected>10pt</option>
                <option value="12">12pt</option>
                <option value="14">14pt</option>
                <option value="18">18pt</option>
                <option value="24">24pt</option>
                <option value="36">36pt</option>
            </select>

            <button class="toolbar_button">B</button>
            <button class="toolbar_button">I</button>
            <button class="toolbar_button">U</button>
        </div>
        <div class="editor" contenteditable="true">
            <p>Welcome to KB Editor! Start typing here...</p>
        </div>
    </main>
  </body>
</html>
